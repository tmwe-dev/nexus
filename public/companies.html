<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus · Report Aziende</title><style>:root{font-family:Inter,system-ui,sans-serif;--bg:#f6f7f8;--line:#e4e7ec;--muted:#667085}*{box-sizing:border-box}body{margin:0;background:var(--bg)}main{max-width:1200px;margin:auto;padding:28px}.top,.tools{display:flex;gap:12px;justify-content:space-between}.tools{margin:20px 0}.tools input{flex:1;padding:11px;border:1px solid var(--line);border-radius:10px}.tools button,a{padding:10px 13px;border:1px solid var(--line);background:#fff;border-radius:10px;color:inherit;text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line);font-size:12px}.head{color:var(--muted);font-weight:700;background:#fafafa}.empty{padding:30px;color:var(--muted);text-align:center}@media(max-width:700px){.row{grid-template-columns:2fr 1fr}.row>*:nth-child(n+3){display:none}}</style></head><body><main><div class="top"><div><small>TMWE NEXUS · COMPANY REGISTRY</small><h1>Report Aziende</h1><p>Anagrafiche societarie Nexus indipendenti.</p></div><a href="/">← Home</a></div><div class="tools"><input id="q" placeholder="Cerca azienda, VAT, città, paese…"><button id="go">Cerca</button></div><section id="list" class="panel"><div class="empty">Caricamento…</div></section></main><script>const e=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));async function load(){try{const r=await fetch('/api/companies?limit=100&search='+encodeURIComponent(q.value.trim()),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.message||d.error);list.innerHTML='<div class="row head"><div>Azienda</div><div>VAT/Tax</div><div>Paese</div><div>Città</div></div>'+((d.items||[]).map(x=>`<div class="row"><div><b>${e(x.name||x.legal_name||'—')}</b></div><div>${e(x.vat_number||x.tax_id||'—')}</div><div>${e(x.country||'—')}</div><div>${e(x.city||'—')}</div></div>`).join('')||'<div class="empty">Nessuna anagrafica ancora presente.</div>')}catch(x){list.innerHTML='<div class="empty">'+e(x.message)+'</div>'}}go.onclick=load;q.onkeydown=x=>{if(x.key==='Enter')load()};load();</script></body></html>
