<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TMWE · Aziende</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#f5f6f7;--ink:#17202a;--muted:#667085;--line:#e4e7ec}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input{font:inherit}.shell{max-width:1120px;margin:0 auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:13px;font-weight:850;letter-spacing:.06em}.back{font-size:12px;color:var(--muted);text-decoration:none}.hero{margin:42px 0 20px}.hero h1{font-size:34px;margin:0 0 6px;letter-spacing:-.04em}.hero p{margin:0;color:var(--muted);font-size:14px}.tools{display:flex;gap:8px;margin:18px 0 14px}.tools input{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.head,.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;padding:12px 16px;align-items:center}.head{background:#fafafa;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}.row{border-top:1px solid #eef0f2;font-size:13px}.row:hover{background:#fafafa}.name{font-weight:750}.empty{padding:34px;text-align:center;color:var(--muted);font-size:13px}@media(max-width:700px){.shell{padding:20px 16px}.tools{flex-direction:column}.head,.row{grid-template-columns:2fr 1fr}.head>*:nth-child(n+3),.row>*:nth-child(n+3){display:none}.hero h1{font-size:30px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand">TMWE</div><a class="back" href="/">← Home</a></header>
    <section class="hero"><h1>Aziende</h1><p>Cerca un'azienda per nome, partita IVA, città o paese.</p></section>
    <div class="tools"><input id="q" placeholder="Cerca azienda"><button id="go" class="btn">Cerca</button></div>
    <section id="list" class="panel"><div class="empty">Caricamento…</div></section>
  </main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
async function load(){try{const r=await fetch('/api/companies?limit=100&search='+encodeURIComponent($('q').value.trim()),{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.error||r.statusText);const items=d.items||[];$('list').innerHTML=items.length?'<div class="head"><div>Azienda</div><div>Partita IVA / Tax ID</div><div>Paese</div><div>Città</div></div>'+items.map(x=>`<div class="row"><div class="name">${esc(x.name||x.legal_name||'—')}</div><div>${esc(x.vat_number||x.tax_id||'—')}</div><div>${esc(x.country||'—')}</div><div>${esc(x.city||'—')}</div></div>`).join(''):'<div class="empty">Nessuna azienda trovata.</div>'}catch(e){$('list').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
$('go').addEventListener('click',load);$('q').addEventListener('keydown',e=>{if(e.key==='Enter')load()});load();
</script>
</body>
</html>
