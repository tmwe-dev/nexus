<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TMWE Nexus · Deployment Map</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#f6f7f8;color:#17202a;--g:#177245;--gb:#eaf6ef;--gl:#a8d8bd;--x:#667085;--xb:#f0f2f4;--xl:#d5d9df;--line:#e4e7ec}*{box-sizing:border-box}body{margin:0}.shell{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px}.badge,.card{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.ok{background:var(--gb);border-color:var(--gl)}.no{background:var(--xb);border-color:var(--xl);color:var(--x)}.small{font-size:11px;color:#667085}.mono{font:11px ui-monospace,monospace;word-break:break-all}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{flex-direction:column}}</style></head><body><main class="shell"><div class="top"><div><div class="small">TMWE NEXUS · SYSTEM MAP V2</div><h1>Deployment-aware status</h1></div><a href="/" class="badge">← Home</a></div><div id="summary" class="badge">Caricamento…</div><div id="deployment" class="grid"></div><div id="cards" class="grid"></div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));async function load(){const r=await fetch('/api/system-map-v2',{cache:'no-store'}),d=await r.json();summary.textContent=`${d.summary.done}/${d.summary.total} · ${d.summary.percent}%`;deployment.innerHTML=[['Sync',d.deployment.in_sync?'SYNC':'OUT-OF-SYNC'],['Vercel SHA',d.deployment.commit],['Expected SHA',d.deployment.expected_release_sha||'not set'],['Branch',d.deployment.branch]].map(x=>`<div class="card ${x[0]==='Sync'?(d.deployment.in_sync?'ok':'no'):''}"><b>${esc(x[0])}</b><div class="mono">${esc(x[1])}</div></div>`).join('');cards.innerHTML=Object.values(d.groups||{}).flat().map(x=>`<div class="card ${x[1]?'ok':'no'}"><b>${esc(x[0])}</b><div class="small">${esc(x[2])}</div></div>`).join('')}load();setInterval(load,30000);</script></body></html>
