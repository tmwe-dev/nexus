<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus · Contact</title><style>:root{font-family:Inter,system-ui,sans-serif;--bg:#f6f7f8;--ink:#17202a;--muted:#667085;--line:#e4e7ec;--green:#177245;--gb:#eaf6ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}main{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px}.back{color:inherit;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;height:max-content}.ey{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted)}h1{margin:5px 0}.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:20px}.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}.box h2{font-size:14px;margin:0 0 14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase}.field div{font-size:13px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--gb);color:var(--green);font-size:11px}.empty{color:var(--muted);font-size:13px}.raw{white-space:pre-wrap;font:11px ui-monospace,monospace;max-height:340px;overflow:auto}@media(max-width:700px){.grid,.fields{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div><div class="ey">TMWE NEXUS · CRM</div><h1 id="title">Contact Detail</h1><div id="subtitle" class="empty">Caricamento…</div></div><a class="back" href="/crm.html">← CRM</a></div><div class="grid"><section class="box"><h2>Profilo</h2><div id="profile" class="empty">Caricamento…</div></section><aside class="box"><h2>Identity & provenance</h2><div id="identity" class="empty">—</div></aside><section class="box"><h2>Attività / dati collegati</h2><div id="activity" class="empty">Disponibili tramite i servizi Nexus collegati.</div></section><aside class="box"><h2>Payload normalizzato</h2><div id="raw" class="raw">—</div></aside></div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));const pick=(o,ps)=>{for(const p of ps){const v=p.split('.').reduce((a,k)=>a&&a[k],o);if(v!==undefined&&v!==null&&v!=='')return v}return ''};const id=new URLSearchParams(location.search).get('id');async function load(){if(!id){subtitle.textContent='ID contatto mancante';return}try{const r=await fetch('/api/crm/contact-detail?id='+encodeURIComponent(id),{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.message||d.error);const name=pick(d,['person.full_name','full_name','name','contact_name'])||'Contact';title.textContent=name;subtitle.innerHTML='<span class="pill">'+esc(pick(d,['lead_status','status','source'])||'Nexus CRM')+'</span>';const f=[['Azienda',pick(d,['company.name','company_name','organization'])],['Email',pick(d,['email','person.email','contact.email'])],['Telefono',pick(d,['phone','person.phone','contact.phone'])],['Paese',pick(d,['country','company.country','address.country'])],['Ruolo',pick(d,['title','job_title','person.title'])],['ID',pick(d,['nexus_id','id','legacy_id'])||id]];profile.innerHTML='<div class="fields">'+f.map(x=>'<div class="field"><label>'+esc(x[0])+'</label><div>'+esc(x[1]||'—')+'</div></div>').join('')+'</div>';identity.innerHTML='<div class="field"><label>Source</label><div>'+esc(pick(d,['source','origin'])||'Nexus')+'</div></div><br><div class="field"><label>Confidence</label><div>'+esc(pick(d,['identity.confidence','confidence'])||'—')+'</div></div>';raw.textContent=JSON.stringify(d,null,2)}catch(e){subtitle.textContent='Datasource non disponibile';profile.textContent=e.message}}load();</script></body></html>
