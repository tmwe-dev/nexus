<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TMWE · Contatto</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#f5f6f7;--panel:#fff;--ink:#17202a;--muted:#667085;--line:#e4e7ec;--soft:#f2f4f7}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}.shell{max-width:1040px;margin:0 auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:13px;font-weight:850;letter-spacing:.06em}.back{font-size:12px;color:var(--muted);text-decoration:none}.hero{margin:40px 0 20px}.hero h1{font-size:34px;margin:0 0 6px;letter-spacing:-.04em}.hero p{margin:0;color:var(--muted);font-size:14px}.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.btn{display:inline-block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}.card h2{font-size:13px;margin:0 0 16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px}.field div{font-size:13px}.activities{display:flex;flex-direction:column;gap:0}.activity{padding:12px 0;border-bottom:1px solid var(--line)}.activity:last-child{border-bottom:0}.activity b{font-size:12px}.activity div{font-size:11px;color:var(--muted);margin-top:4px}.empty{color:var(--muted);font-size:13px;padding:8px 0}@media(max-width:700px){.shell{padding:20px 16px}.grid,.fields{grid-template-columns:1fr}.hero{margin-top:30px}.hero h1{font-size:30px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand">TMWE CRM</div><a class="back" href="/crm.html">← CRM</a></header>
    <section class="hero">
      <h1 id="title">Contatto</h1>
      <p id="subtitle">Caricamento…</p>
      <div id="actions" class="actions"></div>
    </section>
    <div class="grid">
      <section class="card"><h2>Informazioni</h2><div id="profile" class="empty">Caricamento…</div></section>
      <aside class="card"><h2>Attività recenti</h2><div id="activity" class="empty">Caricamento…</div></aside>
    </div>
  </main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const pick=(o,paths)=>{for(const p of paths){const v=p.split('.').reduce((a,k)=>a&&a[k],o);if(v!==undefined&&v!==null&&v!=='')return v}return''};
const id=new URLSearchParams(location.search).get('id');
async function json(url){const r=await fetch(url,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.error||r.statusText);return d}
function renderActivities(items){if(!items.length)return'<div class="empty">Nessuna attività registrata.</div>';return items.slice(0,20).map(x=>{const title=pick(x,['title','subject','activity_type','type','kind'])||'Attività',date=pick(x,['activity_at','occurred_at','created_at','updated_at','date']),detail=pick(x,['summary','description','note','body','status']);return`<div class="activity"><b>${esc(title)}</b><div>${esc(detail||'')}${date?' · '+esc(new Date(date).toLocaleString('it-IT')):''}</div></div>`}).join('')}
async function load(){if(!id){$('subtitle').textContent='Contatto non specificato';return}try{const d=await json('/api/crm/contact-detail?id='+encodeURIComponent(id));const name=pick(d,['person.full_name','full_name','name','contact_name'])||'Contatto',company=pick(d,['company.name','company_name','organization']),email=pick(d,['email','person.email','contact.email']),phone=pick(d,['phone','person.phone','contact.phone']),country=pick(d,['country','company.country','address.country']),role=pick(d,['title','job_title','person.title']),status=pick(d,['lead_status','status']);$('title').textContent=name;$('subtitle').textContent=[role,company,status].filter(Boolean).join(' · ')||'CRM';const fields=[['Azienda',company],['Email',email],['Telefono',phone],['Paese',country],['Ruolo',role],['Stato',status]];$('profile').innerHTML='<div class="fields">'+fields.map(([k,v])=>`<div class="field"><label>${esc(k)}</label><div>${esc(v||'—')}</div></div>`).join('')+'</div>';$('actions').innerHTML=(email?`<a class="btn" href="mailto:${encodeURIComponent(email)}">Scrivi email</a>`:'')+(phone?`<a class="btn" href="tel:${esc(phone)}">Chiama</a>`:'');try{const a=await json('/api/crm/activities?contact_id='+encodeURIComponent(id)+'&limit=20');$('activity').innerHTML=renderActivities(a.items||a.activities||a.data||[])}catch{$('activity').innerHTML='<div class="empty">Nessuna attività disponibile.</div>'}}catch(e){$('subtitle').textContent=e.message;$('profile').innerHTML='<div class="empty">Impossibile caricare il contatto.</div>';$('activity').innerHTML=''}}load();
</script>
</body>
</html>
