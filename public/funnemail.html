<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TMWE Nexus · Funnemail</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#f6f7f8;color:#17202a;--line:#e4e7ec;--green:#177245;--soft:#fff;--muted:#667085;--warn:#fff6db}*{box-sizing:border-box}body{margin:0}.shell{max-width:1280px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px}.ey{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}h1{margin:5px 0;font-size:34px}.sub{color:var(--muted)}.nav{display:flex;gap:8px;margin:18px 0}.nav a{padding:9px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:inherit;background:#fff}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.status{font-weight:800}.ok{color:var(--green)}.bad{color:#9a6700}.caps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.cap{border:1px solid var(--line);border-radius:10px;padding:10px}.cap b{display:block;font-size:12px}.cap span{font-size:11px;color:var(--muted)}label{display:block;font-size:12px;font-weight:700;margin-top:10px}input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;margin-top:5px;font:inherit}button{margin-top:12px;border:0;border-radius:9px;padding:10px 14px;background:#17202a;color:#fff;font-weight:700;cursor:pointer}.messages{margin-top:14px}.row{border-top:1px solid var(--line);padding:10px 0}.row:first-child{border-top:0}.meta{font:11px ui-monospace,monospace;color:var(--muted)}@media(max-width:800px){.grid,.caps{grid-template-columns:1fr}}</style></head><body><main class="shell"><div class="top"><div><div class="ey">TMWE Nexus · Connected Application</div><h1>Funnemail</h1><p class="sub">Workspace Nexus dedicato. Funnemail originale rimane proprietario dello stato email.</p></div><div id="runtime" class="status">verifica…</div></div><div class="nav"><a href="/">Home</a><a href="/system.html">System Map</a></div><div class="grid"><section class="card"><h2>Messaggi</h2><div><input id="search" placeholder="Cerca messaggi"><button id="load">Carica</button></div><div id="messages" class="messages"><div class="meta">Il runtime live richiede NEXUS_FUNNEMAIL_URL/TOKEN e autorizzazione email:read.</div></div></section><aside><section class="card"><h2>Capability</h2><div id="caps" class="caps">caricamento…</div></section><section class="card" style="margin-top:14px"><h2>Invia email</h2><label>Destinatario<input id="to" type="email"></label><label>Oggetto<input id="subject"></label><label>Messaggio<textarea id="body" rows="7"></textarea></label><button id="send">Invia</button><div id="sendStatus" class="meta"></div></section></aside></div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));async function json(url,opt){const r=await fetch(url,{cache:'no-store',...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||d.error||r.statusText);return d}async function init(){try{const[c,l]=await Promise.all([json('/api/funnemail/capabilities'),json('/api/connections/live-status')]);caps.innerHTML=(c.capabilities||[]).map(x=>`<div class="cap"><b>${esc(x.name)}</b><span>${esc(x.status)} · ${esc(x.source)}</span></div>`).join('');const f=(l.services||l.data||[]).find?.(x=>String(x.service||'').toUpperCase()==='FUNNEMAIL');runtime.textContent=f?.reachable?'LIVE':'BOUNDARY READY';runtime.className='status '+(f?.reachable?'ok':'bad')}catch(e){runtime.textContent='STATUS UNAVAILABLE';runtime.className='status bad'}}async function loadMessages(){messages.innerHTML='<div class="meta">caricamento…</div>';try{const q=new URLSearchParams({limit:'30'});if(search.value.trim())q.set('search',search.value.trim());const d=await json('/api/email/messages?'+q);const rows=d.data?.items||d.data?.messages||d.data||[];messages.innerHTML=Array.isArray(rows)&&rows.length?rows.map(m=>`<div class="row"><b>${esc(m.subject||'(senza oggetto)')}</b><div>${esc(m.from?.email||m.from||m.sender||'')}</div><div class="meta">${esc(m.received_at||m.date||m.created_at||'')}</div></div>`).join(''):'<div class="meta">Nessun messaggio disponibile.</div>'}catch(e){messages.innerHTML='<div class="meta">'+esc(e.message)+'</div>'}}async function sendMail(){sendStatus.textContent='invio…';try{await json('/api/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:to.value.trim(),subject:subject.value.trim(),body:body.value})});sendStatus.textContent='Email inviata';body.value=''}catch(e){sendStatus.textContent=e.message}}load.onclick=loadMessages;send.onclick=sendMail;init();</script></body></html>
