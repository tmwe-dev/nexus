<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TMWE · CRM</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#f5f6f7;--panel:#fff;--ink:#17202a;--muted:#667085;--line:#e4e7ec;--soft:#f2f4f7}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input{font:inherit}.shell{max-width:1280px;margin:0 auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:34px}.brand{font-size:13px;font-weight:850;letter-spacing:.06em}.back{font-size:12px;color:var(--muted);text-decoration:none}.title h1{font-size:34px;margin:0 0 6px;letter-spacing:-.04em}.title p{margin:0;color:var(--muted);font-size:14px}.tabs{display:flex;gap:5px;margin:24px 0 14px}.tab{border:0;background:transparent;border-radius:9px;padding:9px 13px;cursor:pointer;color:#475467}.tab.active{background:#17202a;color:#fff}.toolbar{display:flex;gap:8px;margin-bottom:14px}.toolbar input{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.head,.row{display:grid;grid-template-columns:2fr 1.4fr 1fr 1fr;gap:12px;padding:12px 16px;align-items:center}.head{background:#fafafa;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}.row{border-top:1px solid #eef0f2;font-size:13px}.row:hover{background:#fafafa}.name{font-weight:750}.name a{color:inherit;text-decoration:none}.name a:hover{text-decoration:underline}.muted{color:var(--muted);font-size:12px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f2f4f7;color:#475467;font-size:10px}.empty{padding:34px;text-align:center;color:var(--muted);font-size:13px}.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.column{background:#eceff2;border:1px solid var(--line);border-radius:14px;padding:10px;min-height:300px}.column h3{font-size:11px;margin:3px 4px 11px;text-transform:uppercase;letter-spacing:.05em;color:#475467}.deal{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px}.deal b{font-size:12px}.deal div{font-size:10px;color:var(--muted);margin-top:4px}.footer{margin-top:26px;font-size:11px;color:#98a2b3}@media(max-width:800px){.kanban{grid-template-columns:1fr 1fr}.head,.row{grid-template-columns:2fr 1fr}.head>*:nth-child(n+3),.row>*:nth-child(n+3){display:none}}@media(max-width:540px){.shell{padding:20px 16px}.toolbar{flex-direction:column}.kanban{grid-template-columns:1fr}.title h1{font-size:30px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand">TMWE CRM</div><a class="back" href="/">← Home</a></header>
    <section class="title"><h1>CRM</h1><p>Clienti, contatti e opportunità.</p></section>

    <nav class="tabs">
      <button class="tab active" data-tab="contacts">Contatti</button>
      <button class="tab" data-tab="accounts">Aziende</button>
      <button class="tab" data-tab="pipeline">Opportunità</button>
    </nav>

    <div class="toolbar"><input id="search" placeholder="Cerca nome, azienda o paese"><button id="go" class="btn">Cerca</button></div>
    <section id="list" class="panel"><div class="empty">Caricamento…</div></section>
    <section id="pipeline" class="kanban" hidden></section>
    <div class="footer"><span id="count">0</span> risultati</div>
  </main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const pick=(o,paths)=>{for(const p of paths){const v=p.split('.').reduce((a,k)=>a&&a[k],o);if(v!==undefined&&v!==null&&v!=='')return v}return''};
let active='contacts';
async function json(url){const r=await fetch(url,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.error||r.statusText);return d}
function renderRows(items,type){$('count').textContent=items.length;if(!items.length)return'<div class="empty">Nessun risultato.</div>';return'<div class="head"><div>Nome</div><div>Azienda</div><div>Paese</div><div>Stato</div></div>'+items.map(x=>{const name=pick(x,['person.full_name','full_name','name','contact_name','company_name','account_name'])||'—',company=pick(x,['company.name','company_name','account_name','organization'])||'—',country=pick(x,['country','company.country','address.country'])||'—',status=pick(x,['lead_status','stage','status'])||'—',id=pick(x,['nexus_id','id','legacy_id']);const linked=type==='contact'&&id?`<a href="/contact.html?id=${encodeURIComponent(id)}">${esc(name)}</a>`:esc(name);return`<div class="row"><div class="name">${linked}</div><div>${esc(company)}</div><div>${esc(country)}</div><div><span class="pill">${esc(status)}</span></div></div>`}).join('')}
function renderPipeline(items){const stages=[['lead','Da valutare'],['qualified','Qualificati'],['opportunity','Opportunità'],['customer','Clienti']],b=Object.fromEntries(stages.map(([k])=>[k,[]]));items.forEach(x=>{const raw=String(pick(x,['stage','lead_status','status'])||'lead').toLowerCase();const key=stages.map(x=>x[0]).find(k=>raw.includes(k))||'lead';b[key].push(x)});$('count').textContent=items.length;return stages.map(([key,label])=>`<div class="column"><h3>${esc(label)} · ${b[key].length}</h3>${b[key].map(x=>`<div class="deal"><b>${esc(pick(x,['person.full_name','company_name','account_name','name'])||'Record')}</b><div>${esc(pick(x,['company.name','country','stage','lead_status'])||'')}</div></div>`).join('')}</div>`).join('')}
async function load(){const q=encodeURIComponent($('search').value.trim());$('list').hidden=false;$('pipeline').hidden=true;$('list').innerHTML='<div class="empty">Caricamento…</div>';try{if(active==='contacts'){const d=await json('/api/crm/contacts?limit=80&search='+q);$('list').innerHTML=renderRows(d.items||[],'contact')}else if(active==='accounts'){const d=await json('/api/crm/accounts?limit=80&search='+q);$('list').innerHTML=renderRows(d.items||[],'account')}else{const d=await json('/api/crm/pipeline?limit=120&search='+q),items=d.items||d.contacts||d.pipeline||[];$('list').hidden=true;$('pipeline').hidden=false;$('pipeline').innerHTML=renderPipeline(items)}}catch(e){$('count').textContent='0';$('list').hidden=false;$('pipeline').hidden=true;$('list').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));active=b.dataset.tab;load()}));$('go').addEventListener('click',load);$('search').addEventListener('keydown',e=>{if(e.key==='Enter')load()});load();
</script>
</body>
</html>
