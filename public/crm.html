<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TMWE Nexus CRM</title><style>:root{font-family:Inter,system-ui,sans-serif;--bg:#f6f7f8;--ink:#17202a;--muted:#667085;--line:#e4e7ec;--green:#177245;--gb:#eaf6ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}.shell{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px}.ey{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted)}h1{margin:4px 0}.sub{margin:0;color:var(--muted);font-size:13px}.back{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;text-decoration:none;color:inherit;height:max-content}.status{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:12px}.metric{padding:13px}.metric b{display:block;font-size:18px}.metric span{font-size:11px;color:var(--muted)}.tabs,.toolbar{display:flex;gap:8px;margin:12px 0}.tab,.toolbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;cursor:pointer}.tab.active,.toolbar button{background:#17202a;color:#fff}.toolbar input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.panel{overflow:hidden}.headrow,.row{display:grid;grid-template-columns:2fr 1.25fr 1fr 1fr 110px;gap:12px;padding:11px 14px;align-items:center}.headrow{font-size:11px;color:var(--muted);font-weight:700;background:#fafafa}.row{font-size:12px;border-top:1px solid var(--line)}.name{font-weight:700}.name a{color:inherit}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;background:var(--gb);color:var(--green)}.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.col{background:#f0f2f4;border:1px solid var(--line);border-radius:13px;padding:10px;min-height:260px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}.footer{font-size:10px;color:var(--muted);margin-top:16px}@media(max-width:800px){.status,.kanban{grid-template-columns:1fr 1fr}.headrow,.row{grid-template-columns:2fr 1fr 1fr}.headrow>*:nth-child(n+4),.row>*:nth-child(n+4){display:none}}@media(max-width:550px){.status,.kanban{grid-template-columns:1fr}.toolbar{flex-direction:column}}</style></head><body><main class="shell"><div class="top"><div><div class="ey">TMWE NEXUS · OPERATOR WORKSPACE</div><h1>CRM</h1><p class="sub">Contacts, Accounts e Pipeline. Originali read-only.</p></div><a class="back" href="/">← System Map</a></div><div class="status"><div class="metric"><b id="health">…</b><span>Nexus health</span></div><div class="metric"><b id="storage">…</b><span>CRM storage</span></div><div class="metric"><b id="mode">…</b><span>read mode</span></div><div class="metric"><b id="count">0</b><span>record</span></div></div><div class="tabs"><button class="tab active" data-tab="contacts">Contacts</button><button class="tab" data-tab="accounts">Accounts</button><button class="tab" data-tab="pipeline">Pipeline</button></div><div class="toolbar"><input id="search" placeholder="Cerca nome, azienda, paese…"><button id="go">Cerca</button><button id="refresh">Aggiorna</button></div><section id="list" class="panel"><div class="empty">Caricamento…</div></section><section id="pipeline" class="kanban" style="display:none"></section><div class="footer">Nexus CRM · nessuna scrittura verso Navigator, WCA App o altri originali.</div></main><script>let active='contacts';const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));function pick(o,ps){for(const p of ps){let v=p.split('.').reduce((a,k)=>a&&a[k],o);if(v!==undefined&&v!==null&&v!=='')return v}return ''}async function j(u){const r=await fetch(u,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.error||r.statusText);return d}async function loadStatus(){try{const h=await j('/api/health');health.textContent=h.status||'ok'}catch{health.textContent='error'}try{const s=await j('/api/crm/storage-status');storage.textContent=s.persistence;mode.textContent=s.read_mode}catch{storage.textContent='unavailable';mode.textContent='unknown'}}function rows(items,type){count.textContent=items.length;if(!items.length)return '<div class="empty">Nessun record trovato.</div>';return '<div class="headrow"><div>Nome</div><div>Azienda</div><div>Paese</div><div>Stato</div><div>Fonte</div></div>'+items.map(x=>{const name=pick(x,['person.full_name','full_name','name','contact_name','company_name','account_name'])||'—',company=pick(x,['company.name','company_name','account_name','organization'])||'—',country=pick(x,['country','company.country','address.country'])||'—',state=pick(x,['lead_status','stage','status'])||type,source=pick(x,['source','signals.origin','origin'])||'Nexus',id=pick(x,['nexus_id','id','legacy_id']);const shown=type==='contact'&&id?`<a href="/contact.html?id=${encodeURIComponent(id)}">${esc(name)}</a>`:esc(name);return `<div class="row"><div class="name">${shown}</div><div>${esc(company)}</div><div>${esc(country)}</div><div><span class="pill">${esc(state)}</span></div><div>${esc(source)}</div></div>`}).join('')}function pipelineView(items){const stages=['lead','qualified','opportunity','customer'],b=Object.fromEntries(stages.map(s=>[s,[]]));items.forEach(x=>{let s=String(pick(x,['stage','lead_status','status'])||'lead').toLowerCase(),k=stages.find(v=>s.includes(v))||'lead';b[k].push(x)});count.textContent=items.length;return stages.map(s=>`<div class="col"><b>${s.toUpperCase()} · ${b[s].length}</b>${b[s].map(x=>`<div class="card">${esc(pick(x,['person.full_name','company_name','account_name','name'])||'Record')}</div>`).join('')}</div>`).join('')}async function load(){const q=encodeURIComponent(search.value.trim());try{if(active==='contacts'){const d=await j('/api/crm/contacts?limit=50&search='+q);pipeline.style.display='none';list.style.display='block';list.innerHTML=rows(d.items||[],'contact')}else if(active==='accounts'){const d=await j('/api/crm/accounts?limit=50&search='+q);pipeline.style.display='none';list.style.display='block';list.innerHTML=rows(d.items||[],'account')}else{const d=await j('/api/crm/pipeline?limit=100&search='+q),items=d.items||d.contacts||d.pipeline||[];list.style.display='none';pipeline.style.display='grid';pipeline.innerHTML=pipelineView(items)}}catch(e){count.textContent='0';list.style.display='block';pipeline.style.display='none';list.innerHTML=`<div class="empty"><b>Datasource non disponibile</b><br>${esc(e.message)}</div>`}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.tab;load()});go.onclick=load;refresh.onclick=()=>{loadStatus();load()};search.addEventListener('keydown',e=>{if(e.key==='Enter')load()});loadStatus();load();</script></body></html>
