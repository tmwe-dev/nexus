<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TMWE Nexus CRM</title><style>:root{font-family:Inter,system-ui,sans-serif;--bg:#f6f7f8;--ink:#17202a;--muted:#667085;--line:#e4e7ec;--green:#177245;--gb:#eaf6ef;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}.shell{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.ey{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h1{margin:4px 0 3px;font-size:30px}.sub{margin:0;color:var(--muted);font-size:13px}.back{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;text-decoration:none}.status{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px}.metric b{display:block;font-size:18px}.metric span{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:8px;margin:18px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;cursor:pointer}.tab.active{background:#17202a;color:#fff}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input{flex:1;min-width:180px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.toolbar button{border:0;border-radius:10px;background:#17202a;color:#fff;padding:10px 14px;cursor:pointer}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.headrow,.row{display:grid;grid-template-columns:2fr 1.25fr 1fr 1fr 110px;gap:12px;align-items:center;padding:11px 14px}.headrow{font-size:11px;color:var(--muted);font-weight:700;background:#fafafa;border-bottom:1px solid var(--line)}.row{font-size:12px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.name{font-weight:700}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;background:var(--gb);color:var(--green)}.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.col{background:#f0f2f4;border:1px solid var(--line);border-radius:13px;padding:10px;min-height:280px}.col h3{font-size:12px;margin:2px 2px 10px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}.card b{font-size:12px}.card div{font-size:10px;color:var(--muted);margin-top:5px}.footer{font-size:10px;color:var(--muted);margin-top:16px}.good{color:var(--green)}.warn{color:#b54708}@media(max-width:900px){.status{grid-template-columns:repeat(2,1fr)}.headrow,.row{grid-template-columns:2fr 1fr 1fr}.headrow>*:nth-child(4),.headrow>*:nth-child(5),.row>*:nth-child(4),.row>*:nth-child(5){display:none}.kanban{grid-template-columns:1fr 1fr}}@media(max-width:600px){.shell{padding:16px}.top{flex-direction:column}.status,.kanban{grid-template-columns:1fr}.toolbar{flex-direction:column}}</style></head><body><main class="shell"><div class="top"><div><div class="ey">TMWE Nexus · Operator Workspace</div><h1>CRM</h1><p class="sub">Vista operativa su Contacts, Accounts e Pipeline. Gli originali restano read-only.</p></div><a class="back" href="/">← System Map</a></div><div class="status"><div class="metric"><b id="health">…</b><span>Nexus health</span></div><div class="metric"><b id="storage">…</b><span>CRM storage</span></div><div class="metric"><b id="mode">…</b><span>read mode</span></div><div class="metric"><b id="count">0</b><span>record visualizzati</span></div></div><div class="tabs"><button class="tab active" data-tab="contacts">Contacts</button><button class="tab" data-tab="accounts">Accounts</button><button class="tab" data-tab="pipeline">Pipeline</button></div><div class="toolbar"><input id="search" placeholder="Cerca nome, azienda, paese…"><button id="go">Cerca</button><button id="refresh">Aggiorna</button></div><section id="list" class="panel"><div class="empty">Caricamento…</div></section><section id="pipeline" class="kanban" style="display:none"></section><div class="footer">Nexus Operator CRM · nessuna scrittura verso Navigator, WCA App o altri sistemi originali.</div></main><script>let active='contacts';const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));function pick(o,paths){for(const p of paths){let v=p.split('.').reduce((a,k)=>a&&a[k],o);if(v!==undefined&&v!==null&&v!=='')return v}return ''}async function j(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).message||r.statusText);return r.json()}async function loadStatus(){try{const h=await j('/api/health');health.textContent=h.status||'ok';health.className='good'}catch{health.textContent='error';health.className='warn'}try{const s=await j('/api/crm/storage-status');storage.textContent=s.persistence;mode.textContent=s.read_mode}catch{storage.textContent='unavailable';mode.textContent='unknown'}}function rows(items,type){count.textContent=items.length;if(!items.length)return '<div class="empty">Nessun record trovato.</div>';return '<div class="headrow"><div>Nome</div><div>Azienda</div><div>Paese</div><div>Stato</div><div>Fonte</div></div>'+items.map(x=>{const name=pick(x,['person.full_name','full_name','name','contact_name','company_name','account_name'])||'—';const company=pick(x,['company.name','company_name','account_name','organization'])||'—';const country=pick(x,['country','company.country','address.country'])||'—';const state=pick(x,['lead_status','stage','status'])||type;const source=pick(x,['source','signals.origin','origin'])||'Nexus';return `<div class="row"><div class="name">${esc(name)}</div><div>${esc(company)}</div><div>${esc(country)}</div><div><span class="pill">${esc(state)}</span></div><div>${esc(source)}</div></div>`}).join('')}function pipelineView(items){const stages=['lead','qualified','opportunity','customer'];const buckets=Object.fromEntries(stages.map(s=>[s,[]]));items.forEach(x=>{let s=String(pick(x,['stage','lead_status','status'])||'lead').toLowerCase();let k=stages.find(v=>s.includes(v))||'lead';buckets[k].push(x)});count.textContent=items.length;return stages.map(s=>`<div class="col"><h3>${s.toUpperCase()} · ${buckets[s].length}</h3>${buckets[s].map(x=>`<div class="card"><b>${esc(pick(x,['person.full_name','company_name','account_name','name'])||'Record')}</b><div>${esc(pick(x,['country','company.country'])||'')}</div></div>`).join('')}</div>`).join('')}async function load(){const q=encodeURIComponent(search.value.trim());try{if(active==='contacts'){const d=await j('/api/crm/contacts?limit=50&search='+q);pipeline.style.display='none';list.style.display='block';list.innerHTML=rows(d.items||[],'contact')}else if(active==='accounts'){const d=await j('/api/crm/accounts?limit=50&search='+q);pipeline.style.display='none';list.style.display='block';list.innerHTML=rows(d.items||[],'account')}else{const d=await j('/api/crm/pipeline?limit=100&search='+q);const items=d.items||d.contacts||d.pipeline||[];list.style.display='none';pipeline.style.display='grid';pipeline.innerHTML=pipelineView(items)}}catch(e){count.textContent='0';list.style.display='block';pipeline.style.display='none';list.innerHTML=`<div class="empty"><b>Datasource non disponibile</b><br>${esc(e.message)}<br><br>La UI è operativa; configura le connessioni per visualizzare i dati reali.</div>`}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.tab;load()});go.onclick=load;refresh.onclick=()=>{loadStatus();load()};search.addEventListener('keydown',e=>{if(e.key==='Enter')load()});loadStatus();load();</script></body></html>
